<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Open Brain</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.webp">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #262626;
    }
    header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; display: inline-block; }
    .dot.connected { background: #22c55e; }
    .dot.disconnected { background: #ef4444; }
    #signOutBtn {
      background: #161616;
      border: 1px solid #262626;
      color: #e5e5e5;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    #signOutBtn:hover { border-color: #6366f1; }

    /* AUTH SCREEN */
    #authScreen {
      max-width: 360px;
      margin: 80px auto;
      padding: 28px;
      background: #161616;
      border: 1px solid #262626;
      border-radius: 14px;
    }
    #authScreen h2 { margin-bottom: 18px; font-size: 20px; }
    #authScreen input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: #0f0f0f;
      border: 1px solid #262626;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 14px;
    }
    #authScreen input:focus { outline: none; border-color: #6366f1; }
    #authSubmitBtn {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    #authSubmitBtn:hover { background: #4f46e5; }
    #authToggle {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: #a3a3a3;
      cursor: pointer;
    }
    #authToggle span { color: #818cf8; text-decoration: underline; }
    #authError {
      color: #f87171;
      font-size: 13px;
      margin-bottom: 10px;
      min-height: 16px;
    }

    /* MAIN APP */
    #mainApp { max-width: 640px; margin: 0 auto; padding: 16px; }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 18px;
      border-bottom: 1px solid #262626;
    }
    .tab-btn {
      background: #161616;
      border: 1px solid #262626;
      color: #a3a3a3;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }
    .tab-btn.active { background: #6366f1; color: white; border-color: #6366f1; }
    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
    }
    textarea, input[type=text], input[type=url], select {
      width: 100%;
      padding: 12px;
      background: #0f0f0f;
      border: 1px solid #262626;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 10px;
    }
    textarea:focus, input:focus, select:focus { outline: none; border-color: #6366f1; }
    button.primary {
      background: #6366f1;
      border: none;
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary:hover { background: #4f46e5; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid #262626;
      color: #e5e5e5;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    /* VOICE */
    #micBtn {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: #6366f1;
      border: none;
      color: white;
      font-size: 32px;
      cursor: pointer;
      display: block;
      margin: 10px auto 20px;
    }
    #micBtn.listening { animation: pulse 1.2s infinite; background: #ef4444; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      70% { box-shadow: 0 0 0 20px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }

    /* PDF drop zone */
    #pdfDrop {
      border: 2px dashed #262626;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: #a3a3a3;
      cursor: pointer;
      margin-bottom: 14px;
    }
    #pdfDrop.dragover { border-color: #6366f1; color: #e5e5e5; }

    /* thought cards */
    .thought-card {
      background: #161616;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .thought-meta { font-size: 11px; color: #737373; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .private-toggle { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; padding: 10px 12px; border: 1px solid #2a2a2a; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .private-toggle input { width: auto; margin: 0; }
    .private-toggle.on { border-color: #fbbf24; background: #1f1a0a; }
    .private-toggle.on span:first-of-type { color: #fbbf24; font-weight: 600; }
    .long-thought summary { list-style: none; cursor: pointer; }
    .long-thought summary::-webkit-details-marker { display: none; }
    .long-thought[open] summary { display: none; }
    .show-all { display: inline-block; margin-top: 6px; color: #a5b4fc; font-size: 13px; }
    .matched-chunk { margin-top: 8px; padding: 10px 12px; border-left: 3px solid #6366f1; background: #12122a; border-radius: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .private-badge { color: #fbbf24; font-weight: 600; }
    .privacy-btn { margin-left: auto; background: none; border: 1px solid #2a2a2a; color: #a3a3a3; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .open-pdf-btn { background: none; border: 1px solid #2a2a2a; color: #a5b4fc; border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .open-pdf-btn:hover { border-color: #6366f1; color: #e5e5e5; }
    .privacy-btn:hover { border-color: #6366f1; color: #e5e5e5; }
    .thought-content { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #262626;
      color: #a3a3a3;
      margin-right: 6px;
    }
    .muted { color: #737373; font-size: 13px; }
    .progress { font-size: 13px; color: #818cf8; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <h1><span class="dot" id="statusDot"></span> My Open Brain</h1>
    <button id="signOutBtn" style="display:none;">Sign out</button>
  </header>

  <!-- AUTH SCREEN -->
  <div id="authScreen" style="display:none;">
    <h2 id="authTitle">Sign in</h2>
    <div id="authError"></div>
    <input type="text" id="authEmail" placeholder="Email" autocomplete="username">
    <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
    <button id="authSubmitBtn">Sign in</button>
    <div id="authToggle">Don't have an account? <span>Create one</span></div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" style="display:none;">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="voice">🎙️ Voice</button>
      <button class="tab-btn" data-tab="youtube">📹 YouTube</button>
      <button class="tab-btn" data-tab="pdf">📄 PDF</button>
      <button class="tab-btn" data-tab="url">🔗 URL</button>
      <button class="tab-btn" data-tab="search">🔍 Search</button>
      <button class="tab-btn" data-tab="recent">🕓 Recent</button>
    </nav>

    <label class="private-toggle" id="privateToggle">
      <input type="checkbox" id="savePrivate">
      <span>🔒 Save as private</span>
      <span class="muted">— never sent to AI, kept out of search, Claude, Telegram and the digest</span>
    </label>

    <!-- VOICE -->
    <section class="panel active" id="panel-voice">
      <div class="card">
        <button id="micBtn">🎤</button>
        <p class="muted" id="voiceStatus" style="text-align:center;">Tap the mic and speak a thought</p>
        <textarea id="voiceTranscript" rows="4" placeholder="Your spoken words will appear here for review..."></textarea>
        <button class="primary" id="saveVoiceBtn">Save to Brain</button>
      </div>
    </section>

    <!-- YOUTUBE -->
    <section class="panel" id="panel-youtube">
      <div class="card">
        <input type="url" id="ytUrl" placeholder="Paste a YouTube video URL">
        <button class="primary" id="ytAutoBtn">⚡ Capture automatically</button>
        <p class="muted" id="ytStatus" style="margin:10px 0;"></p>
        <button class="secondary" id="ytLoadBtn">Or paste the transcript by hand</button>
        <div id="ytPreview"></div>
      </div>
    </section>

    <!-- PDF -->
    <section class="panel" id="panel-pdf">
      <div class="card">
        <div id="pdfDrop">Drag & drop a PDF here, or click to choose a file</div>
        <input type="file" id="pdfFile" accept="application/pdf" style="display:none;">
        <div class="progress" id="pdfProgress"></div>
        <textarea id="pdfText" rows="6" placeholder="Extracted text will appear here for review..." style="display:none;"></textarea>
        <button class="primary" id="savePdfBtn" style="display:none;">Save to Brain</button>
      </div>
    </section>

    <!-- URL -->
    <section class="panel" id="panel-url">
      <div class="card">
        <input type="url" id="urlInput" placeholder="https://example.com/article">
        <p class="muted" style="margin-bottom:10px;">Just paste the link and hit Save — your server fetches the article for you. If a site blocks that, paste the article text below and save again.</p>
        <textarea id="urlText" rows="6" placeholder="Optional: paste the article text here..."></textarea>
        <button class="primary" id="saveUrlBtn">Save to Brain</button>
        <p class="muted" id="urlStatus" style="margin-top:10px;"></p>
      </div>
    </section>

    <!-- SEARCH -->
    <section class="panel" id="panel-search">
      <div class="card">
        <input type="text" id="searchInput" placeholder="Search your thoughts...">
        <div style="display:flex; gap:8px;">
          <button class="primary" id="searchBtn">Search</button>
          <button class="secondary" id="clearSearchBtn">Clear</button>
        </div>
      </div>
      <div id="searchResults"></div>
    </section>

    <!-- RECENT -->
    <section class="panel" id="panel-recent">
      <div id="recentResults"></div>
    </section>
  </div>

<script>
// ===== CONFIG / CLIENT =====
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;

// ===== ENTITY DECODER =====
function decodeEntities(text) {
  if (!text) return text;
  const map = {
    '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#39;': "'", '&nbsp;': ' ',
    '&rsquo;': '\u2019', '&lsquo;': '\u2018', '&rdquo;': '\u201d', '&ldquo;': '\u201c',
    '&mdash;': '\u2014', '&ndash;': '\u2013', '&hellip;': '\u2026',
    '&aacute;': '\u00e1', '&eacute;': '\u00e9', '&iacute;': '\u00ed', '&oacute;': '\u00f3', '&uacute;': '\u00fa',
    '&ntilde;': '\u00f1', '&iexcl;': '\u00a1', '&iquest;': '\u00bf',
    '&Aacute;': '\u00c1', '&Eacute;': '\u00c9', '&Iacute;': '\u00cd', '&Oacute;': '\u00d3', '&Uacute;': '\u00da', '&Ntilde;': '\u00d1'
  };
  let out = text;
  for (const [entity, char] of Object.entries(map)) {
    out = out.split(entity).join(char);
  }
  out = out.split('&amp;').join('&'); // decode &amp; LAST
  return out;
}

// ===== AUTH =====
let authMode = 'signin';
const authTitle = document.getElementById('authTitle');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authToggle = document.getElementById('authToggle');
const authError = document.getElementById('authError');

authToggle.addEventListener('click', () => {
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  authTitle.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  authSubmitBtn.textContent = authMode === 'signin' ? 'Sign in' : 'Create account';
  authToggle.innerHTML = authMode === 'signin'
    ? `Don't have an account? <span>Create one</span>`
    : `Already have an account? <span>Sign in</span>`;
  authError.textContent = '';
});

authSubmitBtn.addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError.textContent = '';
  if (!email || !password) { authError.textContent = 'Enter an email and password.'; return; }

  authSubmitBtn.disabled = true;
  try {
    if (authMode === 'signin') {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { error } = await supabaseClient.auth.signUp({ email, password });
      if (error) throw error;
    }
  } catch (err) {
    authError.textContent = err.message;
  }
  authSubmitBtn.disabled = false;
});

document.getElementById('signOutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

supabaseClient.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user || null;
  if (currentUser) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('signOutBtn').style.display = 'inline-block';
    loadRecent();
  } else {
    document.getElementById('authScreen').style.display = 'block';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('signOutBtn').style.display = 'none';
  }
});

// ===== CONNECTION STATUS =====
async function checkConnection() {
  const dot = document.getElementById('statusDot');
  try {
    const { error } = await supabaseClient.from('thoughts').select('id').limit(1);
    dot.className = 'dot ' + (error && error.code !== 'PGRST116' && error.message && !error.message.includes('JWT') ? 'disconnected' : 'connected');
    if (!error) dot.classList.add('connected');
  } catch {
    dot.classList.add('disconnected');
  }
}
checkConnection();

// ===== TABS =====
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'recent') loadRecent();
  });
});

// ===== SAVE HELPER =====
// ===== SAVE AS PRIVATE =====
// When checked, captures are saved with is_private = true from the very first
// moment, so the enrichment agent skips them and they never reach an AI.
// Stays on until you uncheck it — forgetting to uncheck is the safe mistake.
function savingPrivately() {
  return document.getElementById('savePrivate').checked;
}
document.getElementById('savePrivate').addEventListener('change', (e) => {
  document.getElementById('privateToggle').classList.toggle('on', e.target.checked);
});

async function saveThought(content, metadata = {}) {
  // upsert: saving the exact same text again updates the existing thought
  // instead of creating a duplicate (the database fingerprints each thought)
  const { data, error } = await supabaseClient.from('thoughts').upsert({
    content,
    user_id: currentUser.id,
    metadata,
    // only ever sent as true, so re-saving can never make a private thought public
    ...(savingPrivately() ? { is_private: true } : {})
  }, { onConflict: 'dedup_key,user_id', ignoreDuplicates: false }).select().single();
  if (error) throw error;
  return data;
}

async function saveSource(thoughtId, sourceText, sourceKind) {
  try {
    await supabaseClient.from('thought_sources').upsert({
      thought_id: thoughtId,
      user_id: currentUser.id,
      source_text: sourceText,
      source_kind: sourceKind,
      char_count: sourceText.length,
      truncated: false
    }, { onConflict: 'thought_id' });
  } catch (err) {
    console.warn('Failed to save thought_sources row:', err);
  }
}

// ===== VOICE =====
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;
const micBtn = document.getElementById('micBtn');
const voiceStatus = document.getElementById('voiceStatus');
const voiceTranscript = document.getElementById('voiceTranscript');

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (e) => {
    let finalText = '';
    for (let i = 0; i < e.results.length; i++) {
      finalText += e.results[i][0].transcript;
    }
    voiceTranscript.value = finalText;
  };
  recognition.onerror = (e) => {
    voiceStatus.textContent = 'Error: ' + e.error;
    listening = false;
    micBtn.classList.remove('listening');
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    voiceStatus.textContent = 'Tap the mic and speak a thought';
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
    } else {
      voiceTranscript.value = '';
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
      voiceStatus.textContent = 'Listening... tap again to stop';
    }
  });
} else {
  micBtn.disabled = true;
  voiceStatus.textContent = 'Voice capture is not supported in this browser. Try Chrome or Edge.';
}

document.getElementById('saveVoiceBtn').addEventListener('click', async () => {
  const text = voiceTranscript.value.trim();
  if (!text) return alert('Nothing to save yet — speak a thought first.');
  try {
    await saveThought('🎙️ ' + text);
    voiceTranscript.value = '';
    voiceStatus.textContent = 'Saved! Tap the mic to capture another.';
  } catch (err) {
    alert('Error saving: ' + err.message);
  }
});

// ===== SERVER CAPTURE (Level 3) =====
// Calls one of your edge functions with your login token attached, so the
// function knows whose brain to save into.
async function callCaptureFunction(name, url) {
  try {
    const { data, error } = await supabaseClient.functions.invoke(name, { body: { url, is_private: savingPrivately() } });
    if (error) return { ok: false, error: 'Could not reach the ' + name + ' function: ' + error.message };
    return data;
  } catch (err) {
    return { ok: false, error: err.message };
  }
}

// ===== YOUTUBE =====
document.getElementById('ytAutoBtn').addEventListener('click', async () => {
  const url = document.getElementById('ytUrl').value.trim();
  const status = document.getElementById('ytStatus');
  if (!extractYouTubeId(url)) { status.textContent = "That doesn't look like a YouTube URL."; return; }
  const btn = document.getElementById('ytAutoBtn');
  btn.disabled = true;
  status.textContent = 'Fetching the transcript… this can take up to 30 seconds.';
  const result = await callCaptureFunction('capture-youtube', url);
  btn.disabled = false;
  if (result.ok) {
    status.textContent = result.has_transcript
      ? `Saved "${result.title}" — full transcript (${result.chars.toLocaleString()} characters).`
      : `Saved "${result.title}" — no transcript was available, so the video description was saved instead.`;
    document.getElementById('ytUrl').value = '';
    document.getElementById('ytPreview').innerHTML = '';
  } else {
    status.textContent = result.error;
  }
});

function extractYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

document.getElementById('ytLoadBtn').addEventListener('click', async () => {
  const url = document.getElementById('ytUrl').value.trim();
  const videoId = extractYouTubeId(url);
  const preview = document.getElementById('ytPreview');
  if (!videoId) { preview.innerHTML = '<p class="muted">That doesn\'t look like a YouTube URL.</p>'; return; }

  let title = 'YouTube video';
  let thumbnail = '';
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
    if (res.ok) {
      const data = await res.json();
      title = decodeEntities(data.title);
      thumbnail = data.thumbnail_url;
    }
  } catch (err) {
    console.warn('oEmbed fetch failed:', err);
  }

  preview.innerHTML = `
    ${thumbnail ? `<img src="${thumbnail}" style="width:100%;border-radius:8px;margin-bottom:10px;">` : ''}
    <p style="margin-bottom:10px;"><strong>${title}</strong></p>
    <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" rel="noopener">
      <button class="secondary" style="margin-bottom:10px;">Open video → get transcript</button>
    </a>
    <p class="muted" style="margin-bottom:10px;">On the video page, click "...more" under the video, then "Show transcript". Copy the transcript text and paste it below.</p>
    <textarea id="ytTranscript" rows="6" placeholder="Paste the transcript here..."></textarea>
    <button class="primary" id="saveYtBtn">Save to Brain</button>
  `;

  document.getElementById('saveYtBtn').addEventListener('click', async () => {
    const transcript = document.getElementById('ytTranscript').value.trim();
    if (!transcript) return alert('Paste the transcript first.');
    try {
      const thought = await saveThought(`📹 YouTube: ${title}\n\n${transcript}`, { video_id: videoId });
      await saveSource(thought.id, transcript, 'youtube_transcript');
      preview.innerHTML = '<p class="muted">Saved! Paste another video URL to capture more.</p>';
      document.getElementById('ytUrl').value = '';
    } catch (err) {
      alert('Error saving: ' + err.message);
    }
  });
});

// ===== PDF =====
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pdfDrop = document.getElementById('pdfDrop');
const pdfFile = document.getElementById('pdfFile');
const pdfProgress = document.getElementById('pdfProgress');
const pdfText = document.getElementById('pdfText');
const savePdfBtn = document.getElementById('savePdfBtn');
let pdfFileName = '';
let currentPdf = null;       // the opened PDF, kept so pages can be rendered as pictures
let currentPdfFile = null;   // the original file, saved to your private storage
let visualPages = [];        // page numbers that contain charts, images or diagrams
let imageOnlyPdf = false;    // no text layer at all (scanned, infographic) — read the pages as pictures

pdfDrop.addEventListener('click', () => pdfFile.click());
pdfDrop.addEventListener('dragover', (e) => { e.preventDefault(); pdfDrop.classList.add('dragover'); });
pdfDrop.addEventListener('dragleave', () => pdfDrop.classList.remove('dragover'));
pdfDrop.addEventListener('drop', (e) => {
  e.preventDefault();
  pdfDrop.classList.remove('dragover');
  if (e.dataTransfer.files.length) handlePdf(e.dataTransfer.files[0]);
});
pdfFile.addEventListener('change', () => {
  if (pdfFile.files.length) handlePdf(pdfFile.files[0]);
});

// Does this page have visuals? Images show up as "paint image" drawing steps;
// charts, diagrams and bordered tables show up as lots of drawn shapes.
async function pageHasVisuals(page) {
  const ops = await page.getOperatorList();
  const O = pdfjsLib.OPS;
  let images = 0, shapes = 0;
  for (const fn of ops.fnArray) {
    if (fn === O.paintImageXObject || fn === O.paintInlineImageXObject ||
        fn === O.paintImageMaskXObject || fn === O.paintJpegXObject) images++;
    else if (fn === O.constructPath) shapes++;
  }
  return images > 0 || shapes >= 40;
}

async function handlePdf(file) {
  if (file.type !== 'application/pdf') return alert('Please choose a PDF file.');
  pdfFileName = file.name;
  currentPdfFile = file;
  visualPages = [];
  pdfProgress.textContent = 'Reading file...';
  pdfText.style.display = 'none';
  savePdfBtn.style.display = 'none';

  try {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    currentPdf = pdf;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      pdfProgress.textContent = `Extracting page ${i} of ${pdf.numPages}...`;
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(it => it.str).join(' ') + '\n\n';
      try { if (await pageHasVisuals(page)) visualPages.push(i); } catch { /* skip */ }
    }
    const extracted = decodeEntities(fullText.trim());
    // No readable text (a scan, an infographic, slides saved as pictures):
    // treat every page as a picture so the AI can read it
    imageOnlyPdf = extracted.replace(/\s+/g, '').length < 20;
    if (imageOnlyPdf) visualPages = Array.from({ length: pdf.numPages }, (_, k) => k + 1);
    visualPages = visualPages.slice(0, 12); // keeps cost and time sensible
    pdfText.value = imageOnlyPdf ? '' : extracted;
    const visualNote = imageOnlyPdf
      ? ` This PDF has no text layer (it's made of images)${savingPrivately()
          ? ' — with "Save as private" on, only the file itself will be stored.'
          : ` — the AI will read the words and describe the visuals on ${visualPages.length} page(s) when you save.`}`
      : visualPages.length
      ? ` Found charts/images on ${visualPages.length} page(s) — they'll be described too${savingPrivately() ? ' (not while "Save as private" is on)' : ''}.`
      : '';
    pdfProgress.textContent = `Extracted ${pdf.numPages} page(s) from ${pdfFileName}.${visualNote} Review below before saving.`;
    pdfText.style.display = 'block';
    savePdfBtn.style.display = 'inline-block';
  } catch (err) {
    pdfProgress.textContent = 'Error reading PDF: ' + err.message;
  }
}

// Render one page as a JPEG picture (at most ~1200px wide)
async function renderPage(pageNum) {
  const page = await currentPdf.getPage(pageNum);
  const base = page.getViewport({ scale: 1 });
  const viewport = page.getViewport({ scale: Math.min(2, 1200 / base.width) });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas.toDataURL('image/jpeg', 0.75);
}

savePdfBtn.addEventListener('click', async () => {
  const isPrivate = savingPrivately();
  let text = pdfText.value.trim();
  if (!text && imageOnlyPdf) text = '(This PDF has no text layer — its content is read from the page images below.)';
  if (!text) return alert('No text to save.');
  savePdfBtn.disabled = true;
  try {
    const thought = await saveThought(`📄 PDF: ${pdfFileName}\n\n${text}`, { filename: pdfFileName });
    pdfText.value = '';
    pdfText.style.display = 'none';
    savePdfBtn.style.display = 'none';

    // 1. Keep the original file in your private storage folder
    pdfProgress.textContent = 'Saving the original PDF…';
    const filePath = `${currentUser.id}/${thought.id}.pdf`;
    const { error: upErr } = await supabaseClient.storage.from('pdfs')
      .upload(filePath, currentPdfFile, { upsert: true, contentType: 'application/pdf' });
    if (!upErr) {
      await supabaseClient.from('thoughts')
        .update({ metadata: { ...(thought.metadata || {}), filename: pdfFileName, file_path: filePath } })
        .eq('id', thought.id);
    }

    // 2. Describe the visuals (never for private PDFs)
    let described = 0, failed = 0;
    if (!isPrivate && visualPages.length) {
      for (let i = 0; i < visualPages.length; i += 3) {
        const batch = visualPages.slice(i, i + 3);
        pdfProgress.textContent = `Describing charts & images: page ${batch.join(', ')} (${Math.min(i + 3, visualPages.length)} of ${visualPages.length})…`;
        try {
          const pages = [];
          for (const n of batch) pages.push({ page: n, image: await renderPage(n) });
          const { data, error } = await supabaseClient.functions.invoke('describe-pdf-visuals', {
            body: { thought_id: thought.id, pages, transcribe: imageOnlyPdf },
          });
          if (error || !data?.ok) failed += batch.length; else described += batch.length;
        } catch { failed += batch.length; }
      }
    }

    const parts = ['Saved!'];
    parts.push(upErr ? '(Original file could not be stored.)' : 'Original PDF stored privately.');
    if (isPrivate && visualPages.length) parts.push('Visuals not described — this PDF is private.');
    else if (described) parts.push(`Charts & images described on ${described} page(s).`);
    if (failed) parts.push(`${failed} page(s) couldn't be described.`);
    pdfProgress.textContent = parts.join(' ') + ' Drop another PDF to capture more.';
  } catch (err) {
    alert('Error saving: ' + err.message);
  } finally {
    savePdfBtn.disabled = false;
  }
});

// ===== URL =====
document.getElementById('saveUrlBtn').addEventListener('click', async () => {
  const url = document.getElementById('urlInput').value.trim();
  const text = decodeEntities(document.getElementById('urlText').value.trim());
  const status = document.getElementById('urlStatus');
  if (!url) return alert('Add the URL first.');

  // No pasted text: let the capture-url server function fetch the article
  if (!text) {
    status.textContent = 'Fetching the article…';
    const result = await callCaptureFunction('capture-url', url);
    if (result.ok) {
      status.textContent = `Saved "${result.title}" (${result.chars.toLocaleString()} characters).`;
      document.getElementById('urlInput').value = '';
    } else {
      status.textContent = result.error + ' You can paste the text above and save again.';
    }
    return;
  }

  try {
    const thought = await saveThought(`🔗 URL: ${url}\n\n${text}`, { url });
    await saveSource(thought.id, text, 'web');
    document.getElementById('urlInput').value = '';
    document.getElementById('urlText').value = '';
    alert('Saved to your brain!');
  } catch (err) {
    alert('Error saving: ' + err.message);
  }
});

// ===== SEARCH =====
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
document.getElementById('clearSearchBtn').addEventListener('click', () => {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
});

async function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('searchResults');
  if (!query) return;
  resultsEl.innerHTML = '<p class="muted">Searching...</p>';
  // Hybrid search (meaning + keywords + chunks of long captures) runs on the
  // server in search-brain, because it needs your OpenAI key for embeddings.
  try {
    const { data, error } = await supabaseClient.functions.invoke('search-brain', { body: { query } });
    if (error) throw error;
    if (!data.ok) throw new Error(data.error);
    renderThoughts(data.results, resultsEl);
  } catch (err) {
    resultsEl.innerHTML = `<p class="muted">Error: ${escapeHtml(err.message || String(err))}</p>`;
  }
}

// ===== RECENT =====
async function loadRecent() {
  const resultsEl = document.getElementById('recentResults');
  resultsEl.innerHTML = '<p class="muted">Loading...</p>';
  const { data, error } = await supabaseClient
    .from('thoughts')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(20);
  if (error) { resultsEl.innerHTML = `<p class="muted">Error: ${error.message}</p>`; return; }
  renderThoughts(data, resultsEl);
}

// Long captures (transcripts, PDFs) show a preview with a "Show all" toggle,
// so one document doesn't fill the whole screen.
function renderContent(content) {
  if (content.length <= 600) return `<div class="thought-content">${escapeHtml(content)}</div>`;
  return `<details class="long-thought">
    <summary><div class="thought-content">${escapeHtml(content.slice(0, 600))}…</div>
      <span class="show-all">Show all (${Math.round(content.length / 1000)}k characters)</span></summary>
    <div class="thought-content">${escapeHtml(content)}</div>
  </details>`;
}

function renderThoughts(data, el) {
  if (!data || !data.length) { el.innerHTML = '<p class="muted">Nothing here yet.</p>'; return; }
  el.innerHTML = data.map(t => `
    <div class="thought-card">
      <div class="thought-meta">
        <span>${new Date(t.created_at).toLocaleString()}</span>
        ${t.is_private ? '<span class="private-badge">🔒 Private</span>' : ''}
        ${t.metadata && t.metadata.file_path ? `<button class="open-pdf-btn" data-path="${escapeHtml(t.metadata.file_path)}">📎 Open original PDF</button>` : ''}
        <button class="privacy-btn" data-id="${t.id}" data-private="${t.is_private ? '1' : ''}">
          ${t.is_private ? '🔓 Make public' : '🔒 Make private'}
        </button>
      </div>
      ${t.matched_chunk ? `
        <div class="thought-content"><strong>${escapeHtml(t.content.split('\n')[0].slice(0, 120))}</strong></div>
        <div class="matched-chunk">
          <div class="muted">(from partway through a longer capture)</div>
          …${escapeHtml(t.matched_chunk)}…
        </div>` : renderContent(t.content)}
    </div>
  `).join('');
}

// ===== OPEN ORIGINAL PDF =====
// Makes a private link to your own file that works for 5 minutes, then opens it.
// The tab is opened first (before waiting) so Safari doesn't block it as a pop-up.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.open-pdf-btn');
  if (!btn) return;
  const tab = window.open('', '_blank');
  const { data, error } = await supabaseClient.storage.from('pdfs').createSignedUrl(btn.dataset.path, 300);
  if (error || !data?.signedUrl) {
    if (tab) tab.close();
    return alert('Could not open the file: ' + (error?.message || 'not found'));
  }
  if (tab) tab.location = data.signedUrl; else window.location = data.signedUrl;
});

// ===== PRIVATE FLAG =====
// Private thoughts stay visible to you here, but are hidden from the Telegram
// bot and from the Claude connection you build in Level 4.
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.privacy-btn');
  if (!btn) return;
  const makePrivate = !btn.dataset.private;
  btn.disabled = true;
  const { error } = await supabaseClient
    .from('thoughts')
    .update({ is_private: makePrivate })
    .eq('id', btn.dataset.id);
  btn.disabled = false;
  if (error) return alert('Could not update: ' + error.message);
  btn.dataset.private = makePrivate ? '1' : '';
  btn.textContent = makePrivate ? '🔓 Make public' : '🔒 Make private';
  const meta = btn.closest('.thought-meta');
  const badge = meta.querySelector('.private-badge');
  if (makePrivate && !badge) btn.insertAdjacentHTML('beforebegin', '<span class="private-badge">🔒 Private</span>');
  if (!makePrivate && badge) badge.remove();
});

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ===== SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}
